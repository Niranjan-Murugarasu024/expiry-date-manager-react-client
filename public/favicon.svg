<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="brandGradient" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f78503"/>
      <stop offset="100%" stop-color="#e5832e"/>
    </linearGradient>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="32" height="32" rx="8" fill="#0c0a09"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" stroke="url(#brandGradient)" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Minimal Precision Clock Icon -->
  <circle cx="16" cy="16" r="8.5" stroke="url(#brandGradient)" stroke-width="2.25"/>
  <path d="M16 11.5V16L19 19" stroke="#ffffff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
</svg>